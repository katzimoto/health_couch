name: Tests

# The offline test suite (SQLite + pure analysis functions — no network, no
# Garmin, no OpenAI) runs on every pull request and every push to main, so a
# change that breaks the coaching maths fails here rather than on the VPS.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -q
